<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Harbor &amp; Hearth Coffee (fictional demo store)</title>
<style>body{font-family:Georgia,serif;margin:0;background:#fff;color:#333}header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:#f4efe6}
.icons a{margin-left:12px;display:inline-block;width:22px;height:22px;background:#6b4f3a;border-radius:4px}.hero{position:relative}.hero img{width:100%;height:320px;object-fit:cover;background:#c9b79c;display:block}
.slide[aria-hidden=true]{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:24px}.card img{width:100%;height:180px;background:#d8cbb6;display:block}
.price{color:#b8b0a4}.badge{background:#f0c987;color:#fff;font-size:12px;padding:2px 6px}.qty button{width:28px}footer{background:#2b2522;color:#6e645c;padding:24px}
footer a{color:#6e645c}</style></head>
<body>
<header><a href="/"><img src="logo.png" width="140" height="40"></a>
<nav><ul><li><a href="#">Shop</a></li><div><a href="#">Subscriptions</a></div><li><a href="#">Our story</a></li></ul></nav>
<div class="icons"><a href="/search"></a><a href="/account"></a><a href="/cart"></a></div></header>
<div class="hero"><div class="slide"><img src="hero1.jpg"></div><div class="slide" aria-hidden="true"><a href="/collections/new">New arrivals</a></div>
<button class="prev">&lsaquo;</button><button class="next"><svg width="12" height="12"><path d="M0 0l12 6-12 6z"/></svg></button></div>
<h3>Fresh roasted this week</h3>
<div class="grid">
<div class="card"><a href="/products/sunrise"><img src="p1.jpg"></a><span class="badge">Sale</span><p>Sunrise Blend</p><p class="price">$18.00</p>
<div class="qty"><button>-</button><input type="number" value="1"><button><svg width="10" height="10"><path d="M5 0v10M0 5h10" stroke="#000"/></svg></button></div></div>
<div class="card"><a href="/products/midnight"><img src="p2.jpg"></a><p>Midnight Espresso</p><p class="price">$21.00</p><select><option>12 oz</option><option>2 lb</option></select></div>
<div class="card"><a href="/products/decaf"><img src="p3.jpg"></a><p>Swiss Water Decaf</p><p class="price">$19.00</p></div>
</div>
<footer><form><input type="email" placeholder="Your email"><button>&rarr;</button></form>
<a href="https://instagram.com"><svg width="20" height="20"><circle cx="10" cy="10" r="8"/></svg></a>
<p>&copy; Harbor &amp; Hearth Coffee — a fictional store used to demonstrate an accessibility audit.</p></footer>
</body></html>
